date.timezone = "Asia/Tokyo"
safe_mode=Off
post_max_size=10M
upload_max_filesize=10M
memory_limit=512M
max_execution_time=600

; PCOV: disabled by default so normal test runs (incl. browser tests, which segfault under PCOV) are not affected.
; The coverage targets in the Makefile enable it per run with -d pcov.enabled=1.
pcov.enabled=0
pcov.directory=/var/www/exment